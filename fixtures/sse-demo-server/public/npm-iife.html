<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamLens IIFE 插件</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      button {
        margin-right: 8px;
        padding: 8px 12px;
      }
      pre {
        background: #f4f4f5;
        padding: 12px;
        border-radius: 8px;
        min-height: 120px;
        white-space: pre-wrap;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>StreamLens IIFE 测试页</h1>
    <p>通过普通 <code>&lt;script&gt;</code> 标签加载 <code>/streamlens.iife.js</code>，全局变量为 <code>StreamLens</code>。</p>
    <button id="fetchBtn">fetch 流式 SSE</button>
    <pre id="log"></pre>

    <script src="/streamlens.iife.js"></script>
    <script>
      const sl = StreamLens.installStreamLens({ open: true })
      window.__streamlensDemo = sl
      const logEl = document.getElementById('log')
      document.getElementById('fetchBtn').onclick = async () => {
        const res = await fetch('/api/sse')
        const reader = res.body.getReader()
        while (!(await reader.read()).done) {
          /* drain */
        }
        logEl.textContent =
          'StreamLens ' +
          StreamLens.VERSION +
          ' · requests: ' +
          sl.getRequests().length +
          ' · events: ' +
          sl.getRequests().reduce((sum, request) => sum + request.eventCount, 0)
      }
    </script>
  </body>
</html>
